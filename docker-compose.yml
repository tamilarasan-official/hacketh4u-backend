x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  expose:
    - "3000"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - >-
        require('http').get('http://127.0.0.1:3000/health/', response =>
        process.exit(response.statusCode === 200 ? 0 : 1))
        .on('error', () => process.exit(1))
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

services:
  backend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-1:
    <<: *api

  api-2:
    <<: *api

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - >-
        if [ -n "$${REDIS_PASSWORD}" ]; then
        exec redis-server --appendonly yes --save 60 1000 --requirepass
        "$${REDIS_PASSWORD}"; else exec redis-server --appendonly yes --save 60
        1000; fi
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  video-worker:
    <<: *api
    command: ["node", "dist/workers/video.worker.js"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  background-worker:
    <<: *api
    command: ["node", "dist/workers/background.worker.js"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  bucket-worker:
    <<: *api
    command: ["node", "dist/workers/bucket.worker.js"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  server-manager:
    <<: *api
    command: ["node", "dist/workers/server-manager.js"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
