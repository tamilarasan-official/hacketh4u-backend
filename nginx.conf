upstream hackethos_api {
  # API container addresses change during Compose recreation. Re-resolve them
  # through Docker DNS instead of retaining the addresses seen at startup.
  zone hackethos_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  server api-1:3000 resolve max_fails=3 fail_timeout=10s;
  server api-2:3000 resolve max_fails=3 fail_timeout=10s;
  keepalive 32;
}

server {
  listen 3000;

  client_max_body_size 1g;
  proxy_http_version 1.1;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_set_header Connection "";

  location /media/upload {
    proxy_pass http://hackethos_api;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /media/multipart/ {
    proxy_pass http://hackethos_api;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    proxy_pass http://hackethos_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
